name: CI-FI 1942 Scene Synced Hindi VO

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/cifi-1942-scene-synced-hindi.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet edge-tts

      - name: Generate natural Hindi segments
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p raw fitted final
          python - <<'PY'
          import asyncio, edge_tts
          segments = [
            ('01', 5.5, 'ये सोनारा है—ए-आई से जॉब सर्च ऑटोमेट करने वाला प्लेटफॉर्म।'),
            ('02', 6.0, 'ये अलग-अलग जगहों से ओपनिंग्स ढूँढकर तुम्हारी प्रोफाइल से मैच करता है।'),
            ('03', 7.0, 'और सिर्फ दिखाता नहीं—ए-आई तुम्हारी तरफ से जॉब्स में अप्लाई भी कर सकता है।'),
            ('04', 7.5, 'इसे अपना वर्चुअल रिक्रूटर समझो, जो स्किल्स और एक्सपीरियंस के हिसाब से मौके ढूँढता है।'),
            ('05', 8.0, 'डैशबोर्ड में सारी ओपनिंग्स एक जगह हैं। पसंद वाली रखो, बाकी हटाओ—मैचिंग और बेहतर होती है।'),
            ('06', 8.0, 'शुरुआत में एक छोटा क्वेश्चनेयर—एक्सपीरियंस, रोल, लोकेशन और कैसी जॉब चाहिए।'),
            ('07', 7.5, 'फिर सोनारा उन्हीं प्रेफरेंसेज़ से नई ओपनिंग्स और दूसरे अच्छे मैच सुझाता है।'),
            ('08', 4.5, 'जरूरत पड़े तो इंटरव्यू रिक्वेस्ट्स भी यहीं ट्रैक कर सकते हो।'),
            ('09', 5.118005, 'मतलब—जॉब्स के लिए चैटजीपीटी। लिंक बायो में है।'),
          ]
          async def main():
              for name, target, text in segments:
                  tts = edge_tts.Communicate(text, 'hi-IN-MadhurNeural', rate='+5%', pitch='-2Hz')
                  await tts.save(f'raw/{name}.mp3')
          asyncio.run(main())
          PY

      - name: Fit to exact scene windows
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import subprocess, json
          targets=[5.5,6.0,7.0,7.5,8.0,8.0,7.5,4.5,5.118005]
          for i,target in enumerate(targets,1):
              name=f'{i:02d}'
              p=subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',f'raw/{name}.mp3'],text=True)
              dur=float(json.loads(p)['format']['duration'])
              usable=max(0.8,target-0.16)
              ratio=dur/usable
              filters=['aresample=48000']
              if ratio > 1.005:
                  r=ratio
                  while r > 2.0:
                      filters.append('atempo=2.0'); r/=2.0
                  filters.append(f'atempo={r:.6f}')
              filters += [f'apad=pad_dur={target}',f'atrim=0:{target}','asetpts=PTS-STARTPTS']
              subprocess.run(['ffmpeg','-y','-i',f'raw/{name}.mp3','-af',','.join(filters),'-ac','1','-c:a','pcm_s16le',f'fitted/{name}.wav'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              print(name,'raw=',round(dur,3),'target=',round(target,3),'tempo=',round(max(1.0,ratio),3))
          PY

      - name: Assemble and master VO
        shell: bash
        run: |
          set -euxo pipefail
          printf "file '../fitted/01.wav'\nfile '../fitted/02.wav'\nfile '../fitted/03.wav'\nfile '../fitted/04.wav'\nfile '../fitted/05.wav'\nfile '../fitted/06.wav'\nfile '../fitted/07.wav'\nfile '../fitted/08.wav'\nfile '../fitted/09.wav'\n" > final/list.txt
          ffmpeg -y -f concat -safe 0 -i final/list.txt \
            -af "highpass=f=65,acompressor=threshold=-18dB:ratio=2:attack=10:release=120,alimiter=limit=0.95,loudnorm=I=-16:TP=-1.5:LRA=7" \
            -t 59.118005 -c:a aac -b:a 160k final/CI-FI_1942_Scene_Synced_Hindi_VO.m4a
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 final/CI-FI_1942_Scene_Synced_Hindi_VO.m4a

      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: cifi-1942-scene-synced-hindi-vo
          path: final/CI-FI_1942_Scene_Synced_Hindi_VO.m4a
          if-no-files-found: error
