name: CI-FI 2078 Chatterbox Space Meme VO

on:
  pull_request:
    branches: [master]
  push:
    branches: [cifi-2078-kokoro-hindi-20260823]
    paths:
      - '.github/workflows/cifi-2078-chatterbox-space.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install lightweight client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -U gradio_client soundfile numpy

      - name: Generate expressive Hindi parody-character VO
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p refs raw final
          curl -L --retry 3 -o refs/authoritative.mp3 'https://resource.heygen.ai/text_to_speech/rHCz2NDYdzFet8XCt7ARaP.mp3'
          curl -L --retry 3 -o refs/blunt.mp3 'https://resource.heygen.ai/text_to_speech/R8RkN387WyRsCrvumgoPYF.mp3'
          curl -L --retry 3 -o refs/earnest.mp3 'https://resource.heygen.ai/text_to_speech/bhDxGeZnTgZpBq8BUX3TuC.mp3'

          cat > /tmp/gen.py <<'PY'
          import os, shutil, subprocess
          from gradio_client import Client, handle_file

          client = Client('rahul7star/Chatterbox-Multilingual-TTS')

          segs = [
            ('01','देखिए... ऑनलाइन प्राइवेसी चाहिए, तो शुरुआत सही ब्राउज़र से कीजिए।','refs/authoritative.mp3',0.62,0.72,1101),
            ('02','अरे भाई! क्रोम भी चलाना है और प्राइवेसी भी चाहिए? ये कैसा हिसाब है?','refs/blunt.mp3',0.92,0.76,2202),
            ('03','पहले ब्राउज़र बदलो। फ़ायरफ़ॉक्स, लिब्रेवुल्फ़ या मुलवाड ब्राउज़र—कोई एक ठीक से सेट करो।','refs/authoritative.mp3',0.66,0.70,3303),
            ('04','तो मैं बस वीपीएन लगा लूँ? फिर सब सुरक्षित हो जाएगा ना?','refs/earnest.mp3',0.82,0.73,4404),
            ('05','नहीं महाराज! बेस ही गलत है तो ऊपर दस ताले लगाकर भी क्या फायदा?','refs/blunt.mp3',1.02,0.70,5505),
            ('06','वीपीएन चाहिए तो प्रोटॉन या मुलवाड देखिए। कोई भी रैंडम फ्री वीपीएन मत उठाइए।','refs/authoritative.mp3',0.66,0.72,6606),
            ('07','फिर यूब्लॉक ओरिजिन डालो, और फ़ास्टफ़ॉरवर्ड। बेकार के ऐड और रीडायरेक्ट—दोनों की छुट्टी।','refs/blunt.mp3',0.90,0.72,7707),
            ('08','और टॉरेंट के लिए? वहाँ भी कोई खास जुगाड़ है क्या?','refs/earnest.mp3',0.82,0.74,8808),
            ('09','क्यूबिटटॉरेंट या ट्रांसमिशन। और अनजान फ़ाइल दिखे... हीरो मत बनना, मत खोलना।','refs/authoritative.mp3',0.72,0.70,9909),
          ]

          def gen(name,text,ref,exag,temp,seed):
              result=client.predict(
                  text_input=text,
                  lyrics_input='',
                  mode='Speak 🗣️',
                  language_id='hi',
                  audio_prompt_path_input=handle_file(ref),
                  exaggeration_input=exag,
                  temperature_input=temp,
                  seed_num_input=seed,
                  cfgw_input=0.30,
                  api_name='/generate_tts_audio'
              )
              print(name,'result',result)
              path=result
              if isinstance(result,dict): path=result.get('path') or result.get('name') or result.get('url')
              if isinstance(result,(list,tuple)):
                  path=result[0]
                  if isinstance(path,dict): path=path.get('path') or path.get('name') or path.get('url')
              if not path: raise RuntimeError(f'No audio path: {result}')
              shutil.copyfile(path,f'raw/{name}.wav')

          for s in segs: gen(*s)

          with open('/tmp/concat.txt','w') as f:
              for name,*_ in segs: f.write(f"file '{os.path.abspath('raw/'+name+'.wav')}'\n")
          subprocess.run(['ffmpeg','-y','-f','concat','-safe','0','-i','/tmp/concat.txt','-af','aresample=48000,highpass=f=50,alimiter=limit=0.96,loudnorm=I=-15:TP=-1.2:LRA=14','-c:a','libmp3lame','-b:a','192k','final/CI-FI_2078_Politician_Parody_VO_AUDITION.mp3'],check=True)

          groups={'Authoritative':['01','03','06','09'],'BluntDesi':['02','05','07'],'EarnestComic':['04','08']}
          for label,names in groups.items():
              with open('/tmp/group.txt','w') as f:
                  for n in names: f.write(f"file '{os.path.abspath('raw/'+n+'.wav')}'\n")
              subprocess.run(['ffmpeg','-y','-f','concat','-safe','0','-i','/tmp/group.txt','-af','aresample=48000,loudnorm=I=-15:TP=-1.2:LRA=14','-c:a','libmp3lame','-b:a','192k',f'final/{label}.mp3'],check=True)
          PY
          python /tmp/gen.py
          ls -lh final raw

      - name: Upload standalone voice package
        uses: actions/upload-artifact@v4
        with:
          name: cifi-2078-chatterbox-politician-parody-vo
          path: final/*
          if-no-files-found: error
          retention-days: 14
