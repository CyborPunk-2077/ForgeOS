name: CI-FI 2078 Kokoro Hindi Character VO

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - cifi-2078-kokoro-hindi-20260823
    paths:
      - '.github/workflows/cifi-2078-kokoro-hindi.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install Kokoro Hindi stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install --upgrade pip
          python -m pip install 'kokoro>=0.9.4' soundfile numpy

      - name: Render fresh two-character Hindi performances
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p raw fitted final
          cat > /tmp/render.py <<'PY'
          import subprocess, json
          import soundfile as sf
          import numpy as np
          from kokoro import KPipeline

          pipeline = KPipeline(lang_code='h')

          # Entirely fresh dialogue. Short phrases are intentional: acting should breathe,
          # never be crushed to fit the original character beats.
          segs = [
              ('01',0.016,5.440,'ऑनलाइन प्राइवेसी शुरू करनी है... पहले क्या करूँ?','hm_omega',0.96),
              ('02',5.872,8.000,'क्रोम?! अभी भी?','hm_psi',1.02),
              ('03',8.800,13.150,'प्राइवेसी चाहिए... और क्रोम? वाह, भाई.','hm_psi',1.01),
              ('04',13.296,16.080,'पहले ब्राउज़र बदल.','hm_psi',0.97),
              ('05',16.208,19.760,'वीपीएन, एक्सटेंशन, टॉरेंट—बाद में.','hm_psi',1.04),
              ('06',20.128,23.392,'बेस गलत? बाकी सब दिखावा.','hm_psi',0.98),
              ('07',24.112,27.968,'फ़ायरफ़ॉक्स, लिब्रेवुल्फ़, या मुलवाड.','hm_psi',1.06),
              ('08',28.240,30.704,'एक चुन. बस.','hm_psi',0.94),
              ('09',30.720,34.100,'लिब्रेवुल्फ़... थोड़ा पैरानॉइड.','hm_psi',0.92),
              ('10',34.224,38.240,'प्राइवेसी में थोड़ा पैरानॉइड होना ठीक है.','hm_psi',0.98),
              ('11',38.960,41.968,'वीपीएन? प्रोटॉन. या मुलवाड.','hm_psi',1.01),
              ('12',42.016,44.736,'रैंडम फ्री वीपीएन मत लेना.','hm_psi',1.06),
              ('13',44.800,46.832,'सच में.','hm_psi',0.90),
              ('14',47.664,50.512,'यूब्लॉक ओरिजिन. ज़रूरी.','hm_psi',1.02),
              ('15',50.688,54.544,'फ़ास्टफ़ॉरवर्ड डाल. रीडायरेक्ट खत्म.','hm_psi',1.06),
              ('16',54.656,57.800,'छोटा टूल... बड़ा सुकून.','hm_psi',0.92),
              ('17',57.920,61.776,'क्यूबिटटॉरेंट. या ट्रांसमिशन.','hm_psi',1.02),
              ('18',61.808,63.552,'साफ. सीधा.','hm_psi',0.92),
              ('19',64.480,66.976,'अनजान फ़ाइल?','hm_psi',0.90),
              ('20',67.776,69.600,'मत खोल. बस.','hm_psi',0.88),
          ]

          # Render every take first.
          for name,start,end,text,voice,speed in segs:
              chunks=[audio for _,_,audio in pipeline(text, voice=voice, speed=speed, split_pattern=r'\n+')]
              if not chunks:
                  raise RuntimeError(f'No audio generated for {name}')
              sf.write(f'raw/{name}.wav', np.concatenate(chunks), 24000)

          # Measure ALL lines before failing, so one run exposes every offender.
          measured=[]
          offenders=[]
          for name,start,end,text,voice,speed in segs:
              target=end-start
              meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',f'raw/{name}.wav'], text=True))
              dur=float(meta['format']['duration'])
              usable=max(.45,target-.06)
              ratio=dur/usable
              measured.append((name,dur,target,ratio))
              if ratio > 1.20:
                  offenders.append((name,dur,target,ratio))

          print('=== KOKORO TIMING QA ===')
          for name,dur,target,ratio in measured:
              print(name,'raw',round(dur,3),'window',round(target,3),'tempo_needed',round(max(1.0,ratio),3))
          if offenders:
              print('=== OFFENDERS > 1.20x ===')
              for x in offenders: print(x)
              raise RuntimeError('Dialogue timing QA failed; shorten listed lines')

          # Gentle fit only after all lines pass.
          for name,start,end,text,voice,speed in segs:
              target=end-start
              row=next(x for x in measured if x[0]==name)
              ratio=row[3]
              filt=['aresample=48000']
              if ratio > 1.003:
                  filt.append(f'atempo={ratio:.6f}')
              if name=='01':
                  filt += ['highpass=f=48','equalizer=f=155:t=q:w=1.0:g=1.5','equalizer=f=3200:t=q:w=1.0:g=-0.8']
              else:
                  filt += ['highpass=f=62','equalizer=f=250:t=q:w=1.0:g=0.5','equalizer=f=3100:t=q:w=1.0:g=0.8']
              filt += [f'apad=pad_dur={target}',f'atrim=0:{target}','asetpts=PTS-STARTPTS']
              subprocess.run(['ffmpeg','-y','-i',f'raw/{name}.wav','-af',','.join(filt),'-ac','1','-c:a','pcm_s16le',f'fitted/{name}.wav'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)

          args=[]; chains=[]; labels=[]
          for idx,(name,start,end,*_) in enumerate(segs):
              args += ['-i',f'fitted/{name}.wav']
              d=round(start*1000); lab=f'a{idx}'
              chains.append(f'[{idx}:a]adelay={d}|{d}[{lab}]')
              labels.append(f'[{lab}]')
          mix=''.join(labels)+f'amix=inputs={len(labels)}:normalize=0,acompressor=threshold=-20dB:ratio=1.08:attack=40:release=380,alimiter=limit=0.97,loudnorm=I=-16:TP=-1.5:LRA=17,apad=pad_dur=69.612,atrim=0:69.612[out]'
          subprocess.run(['ffmpeg','-y',*args,'-filter_complex',';'.join(chains+[mix]),'-map','[out]','-t','69.612','-c:a','aac','-b:a','192k','final/CI-FI_2078_Kokoro_Character_Hindi_V3.m4a'],check=True)
          PY
          python /tmp/render.py
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 final/CI-FI_2078_Kokoro_Character_Hindi_V3.m4a

      - name: Upload fresh narration
        uses: actions/upload-artifact@v4
        with:
          name: cifi-2078-kokoro-character-hindi-v3
          path: final/CI-FI_2078_Kokoro_Character_Hindi_V3.m4a
          if-no-files-found: error
          compression-level: 6
