name: CI-FI 2079 Emotional Hindi VO V2

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/cifi-2079-emotional-hindi-v2.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet edge-tts

      - name: Generate expressive Hindi segments
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p raw fitted final
          python - <<'PY'
          import asyncio, edge_tts
          segments = [
            ('01', 5.600, 'ये नया ए-आई टूल वीडियो को सेकंडों में बिल्कुल नई स्टाइल दे देता है।', '+5%', '+2Hz'),
            ('02', 5.600, 'ग्लैम में वीडियो डालो, ट्रेंडिंग फ़िल्टर चुनो—और पूरा लुक बदल जाता है।', '+3%', '+0Hz'),
            ('03', 5.300, 'कार्टून हो या एलन मस्क जैसा लुक—एक टैप में ट्रांसफॉर्मेशन।', '+7%', '+2Hz'),
            ('04', 5.300, 'डिज़ाइन, रीटचिंग और वीडियो एडिटिंग—सब बिना एडवांस स्किल्स के।', '+2%', '-1Hz'),
            ('05', 5.400, 'ए-आई ज़्यादातर काम खुद करता है, बस तुम स्टाइल चुनो।', '+1%', '-1Hz'),
            ('06', 5.500, 'सौ से ज़्यादा प्रो टेम्पलेट्स—हर तरह की रील और ट्रेंड के लिए।', '+4%', '+1Hz'),
            ('07', 4.591, 'टूल अपडेट होता रहता है। ट्राय करना हो, लिंक बायो में है।', '-1%', '-1Hz'),
          ]
          async def main():
              for name, target, text, rate, pitch in segments:
                  tts = edge_tts.Communicate(text, 'hi-IN-MadhurNeural', rate=rate, pitch=pitch)
                  await tts.save(f'raw/{name}.mp3')
          asyncio.run(main())
          PY

      - name: Fit gently to exact scene windows
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import subprocess, json
          targets=[5.600,5.600,5.300,5.300,5.400,5.500,4.591]
          for i,target in enumerate(targets,1):
              name=f'{i:02d}'
              p=subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',f'raw/{name}.mp3'],text=True)
              dur=float(json.loads(p)['format']['duration'])
              usable=max(0.8,target-0.10)
              ratio=dur/usable
              filters=['aresample=48000']
              if ratio > 1.003:
                  r=ratio
                  while r > 2.0:
                      filters.append('atempo=2.0'); r/=2.0
                  filters.append(f'atempo={r:.6f}')
              filters += [f'apad=pad_dur={target}',f'atrim=0:{target}','asetpts=PTS-STARTPTS']
              subprocess.run(['ffmpeg','-y','-i',f'raw/{name}.mp3','-af',','.join(filters),'-ac','1','-c:a','pcm_s16le',f'fitted/{name}.wav'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              print(name,'raw=',round(dur,3),'target=',round(target,3),'tempo=',round(max(1.0,ratio),3))
          PY

      - name: Assemble and master VO
        shell: bash
        run: |
          set -euxo pipefail
          printf "file '../fitted/01.wav'\nfile '../fitted/02.wav'\nfile '../fitted/03.wav'\nfile '../fitted/04.wav'\nfile '../fitted/05.wav'\nfile '../fitted/06.wav'\nfile '../fitted/07.wav'\n" > final/list.txt
          ffmpeg -y -f concat -safe 0 -i final/list.txt \
            -af "highpass=f=65,acompressor=threshold=-18dB:ratio=2:attack=8:release=140,alimiter=limit=0.95,loudnorm=I=-16:TP=-1.5:LRA=8" \
            -t 37.291 -c:a aac -b:a 160k final/CI-FI_2079_Emotional_Hindi_VO.m4a
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 final/CI-FI_2079_Emotional_Hindi_VO.m4a

      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: cifi-2079-emotional-hindi-vo-v2
          path: final/CI-FI_2079_Emotional_Hindi_VO.m4a
          if-no-files-found: error
