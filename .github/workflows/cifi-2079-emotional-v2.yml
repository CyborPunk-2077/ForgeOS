name: CI-FI 2079 Emotional Hindi V2

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/cifi-2079-emotional-v2.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet edge-tts

      - name: Generate expressive scene narration
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p raw fitted final
          python - <<'PY'
          import asyncio, edge_tts
          segments = [
            ('01', 4.50, 'घंटों की एडिटिंग... अब बस कुछ सेकंड।', '-2%', '-1Hz'),
            ('02', 4.00, 'ग्लैम ए-आई... वीडियो एडिटिंग का नया तरीका।', '+1%', '+0Hz'),
            ('03', 4.00, 'वीडियो डालो, फ़िल्टर चुनो... जादू देखो।', '+4%', '+2Hz'),
            ('04', 4.00, 'स्टाइल बदलो... एलन मस्क तक बन जाओ!', '+7%', '+3Hz'),
            ('05', 4.00, 'चेहरा नहीं... पूरी वीडियो की फील बदलती है।', '+0%', '-1Hz'),
            ('06', 4.00, 'एडिटिंग नहीं आती? फिर भी हो जाएगा।', '-1%', '+1Hz'),
            ('07', 4.00, 'ए-आई टेम्पलेट चुनो, अपनी क्लिप डालो।', '+3%', '+1Hz'),
            ('08', 4.00, 'नया ट्रेंड? टेम्पलेट भी अपडेट।', '+3%', '+1Hz'),
            ('09', 4.791, 'कंटेंट बनाते हो? आइडिया से एडिट... एक टैप।', '-1%', '+2Hz'),
          ]
          async def main():
              for name, target, text, rate, pitch in segments:
                  tts = edge_tts.Communicate(text, 'hi-IN-MadhurNeural', rate=rate, pitch=pitch)
                  await tts.save(f'raw/{name}.mp3')
          asyncio.run(main())
          PY

      - name: Fit gently to scene windows
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import subprocess, json
          targets=[4.50,4.00,4.00,4.00,4.00,4.00,4.00,4.00,4.791]
          for i,target in enumerate(targets,1):
              name=f'{i:02d}'
              meta=subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',f'raw/{name}.mp3'],text=True)
              dur=float(json.loads(meta)['format']['duration'])
              usable=max(0.8,target-0.12)
              ratio=dur/usable
              filters=['aresample=48000']
              if ratio > 1.003:
                  r=ratio
                  while r > 2.0:
                      filters.append('atempo=2.0'); r/=2.0
                  filters.append(f'atempo={r:.6f}')
              filters += [f'apad=pad_dur={target}',f'atrim=0:{target}','asetpts=PTS-STARTPTS']
              subprocess.run(['ffmpeg','-y','-i',f'raw/{name}.mp3','-af',','.join(filters),'-ac','1','-c:a','pcm_s16le',f'fitted/{name}.wav'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              print(name,'raw=',round(dur,3),'target=',round(target,3),'tempo=',round(max(1.0,ratio),3))
          PY

      - name: Assemble with wider emotional dynamics
        shell: bash
        run: |
          set -euxo pipefail
          printf "file '../fitted/01.wav'\nfile '../fitted/02.wav'\nfile '../fitted/03.wav'\nfile '../fitted/04.wav'\nfile '../fitted/05.wav'\nfile '../fitted/06.wav'\nfile '../fitted/07.wav'\nfile '../fitted/08.wav'\nfile '../fitted/09.wav'\n" > final/list.txt
          ffmpeg -y -f concat -safe 0 -i final/list.txt \
            -af "highpass=f=60,acompressor=threshold=-23dB:ratio=1.55:attack=14:release=200,alimiter=limit=0.94,loudnorm=I=-16:TP=-1.5:LRA=12" \
            -t 37.291 -c:a aac -b:a 192k final/CI-FI_2079_Emotional_Hindi_V2.m4a
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 final/CI-FI_2079_Emotional_Hindi_V2.m4a

      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: cifi-2079-emotional-hindi-v2
          path: final/CI-FI_2079_Emotional_Hindi_V2.m4a
          if-no-files-found: error
