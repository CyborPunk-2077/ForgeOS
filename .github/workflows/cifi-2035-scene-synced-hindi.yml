name: CI-FI 2035 Scene Synced Hindi VO

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/cifi-2035-scene-synced-hindi.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet edge-tts

      - name: Generate natural Hindi segments
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p raw fitted final
          python - <<'PY'
          import asyncio, edge_tts
          segments = [
            ('01', 5.5, 'ये नया ए-आई टूल नॉर्मल वीडियो को सेकंड्स में अलग-अलग स्टाइल्स में बदल देता है।'),
            ('02', 3.5, 'वीडियो डालो, और ग्लैम में अपना पसंदीदा फिल्टर चुनो।'),
            ('03', 6.8, 'किसी को कार्टून, गेम कैरेक्टर या एलन मस्क जैसे लुक में भी बदल सकते हो।'),
            ('04', 5.7, 'डिजाइन और रीटचिंग टूल्स भी अंदर ही हैं, इसलिए एडिटिंग काफी आसान हो जाती है।'),
            ('05', 4.5, 'प्रो एडिटिंग स्किल नहीं चाहिए—ए-आई भारी काम खुद कर देता है।'),
            ('06', 5.2, 'ऑटो सेलेक्ट के साथ सौ से ज्यादा रेडी प्रो टेम्पलेट्स भी मिलते हैं।'),
            ('07', 3.3, 'और टूल में नए स्टाइल्स लगातार आते रहते हैं।'),
            ('08', 2.791224, 'ट्राय करना हो तो लिंक बायो में है।'),
          ]
          async def main():
              for name, target, text in segments:
                  tts = edge_tts.Communicate(text, 'hi-IN-MadhurNeural', rate='+6%', pitch='-2Hz')
                  await tts.save(f'raw/{name}.mp3')
          asyncio.run(main())
          PY

      - name: Fit to exact scene windows
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import subprocess, json
          targets=[5.5,3.5,6.8,5.7,4.5,5.2,3.3,2.791224]
          for i,target in enumerate(targets,1):
              name=f'{i:02d}'
              p=subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',f'raw/{name}.mp3'],text=True)
              dur=float(json.loads(p)['format']['duration'])
              usable=max(0.7,target-0.15)
              ratio=dur/usable
              filters=['aresample=48000']
              if ratio > 1.005:
                  r=ratio
                  while r > 2.0:
                      filters.append('atempo=2.0'); r/=2.0
                  filters.append(f'atempo={r:.6f}')
              filters += [f'apad=pad_dur={target}',f'atrim=0:{target}','asetpts=PTS-STARTPTS']
              subprocess.run(['ffmpeg','-y','-i',f'raw/{name}.mp3','-af',','.join(filters),'-ac','1','-c:a','pcm_s16le',f'fitted/{name}.wav'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              print(name,'raw=',round(dur,3),'target=',round(target,3),'tempo=',round(max(1.0,ratio),3))
          PY

      - name: Assemble and master VO
        shell: bash
        run: |
          set -euxo pipefail
          printf "file '../fitted/01.wav'\nfile '../fitted/02.wav'\nfile '../fitted/03.wav'\nfile '../fitted/04.wav'\nfile '../fitted/05.wav'\nfile '../fitted/06.wav'\nfile '../fitted/07.wav'\nfile '../fitted/08.wav'\n" > final/list.txt
          ffmpeg -y -f concat -safe 0 -i final/list.txt \
            -af "highpass=f=65,acompressor=threshold=-18dB:ratio=2:attack=10:release=120,alimiter=limit=0.95,loudnorm=I=-16:TP=-1.5:LRA=7" \
            -t 37.291224 -c:a aac -b:a 160k final/CI-FI_2035_Scene_Synced_Hindi_VO.m4a
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 final/CI-FI_2035_Scene_Synced_Hindi_VO.m4a

      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: cifi-2035-scene-synced-hindi-vo
          path: final/CI-FI_2035_Scene_Synced_Hindi_VO.m4a
          if-no-files-found: error
