name: CI-FI 1939 Scene Synced Hindi VO

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/cifi-1939-scene-synced-hindi.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet edge-tts

      - name: Generate natural Hindi segments
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p raw fitted final
          python - <<'PY'
          import asyncio, edge_tts
          segments = [
            ('01', 5.3, 'चैट जीपीटी अब चश्मे में—इसे कहते हैं रियलिटी जीपीटी।'),
            ('02', 4.7, 'ये आसपास की चीज़ों और घटनाओं का कॉन्टेक्स्ट याद रखता है।'),
            ('03', 5.0, 'ए-आई एजेंट आसपास समझकर इंटरनेट से ज़रूरी जानकारी लाते हैं।'),
            ('04', 4.8, 'लाइव ट्रांसक्रिप्शन और ट्रांसलेशन से भाषा तुरंत समझ आती है।'),
            ('05', 5.0, 'यानी जीपीटी मेमोरी और इंटेलिजेंस को रियल वर्ल्ड में बढ़ाता है।'),
            ('06', 4.8, 'ये सिर्फ ग्लासेस नहीं—दूसरे पहनने वाले मॉडल भी हो सकते हैं।'),
            ('07', 5.0, 'यहाँ ब्रेसलेट और नेकलेस जैसे हार्डवेयर कॉन्सेप्ट दिखते हैं।'),
            ('08', 5.2, 'बड़े ए-आई मॉडल्स को अफोर्डेबल रोज़मर्रा हार्डवेयर में लाना मकसद है।'),
            ('09', 5.548503, 'ऐसे हार्डवेयर का पोटेंशियल बड़ा है; पूरा ब्लूप्रिंट बायो में है।'),
          ]
          async def main():
              for name, target, text in segments:
                  tts = edge_tts.Communicate(text, 'hi-IN-MadhurNeural', rate='+4%', pitch='-2Hz')
                  await tts.save(f'raw/{name}.mp3')
          asyncio.run(main())
          PY

      - name: Fit to exact scene windows
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import subprocess, json
          targets=[5.3,4.7,5.0,4.8,5.0,4.8,5.0,5.2,5.548503]
          for i,target in enumerate(targets,1):
              name=f'{i:02d}'
              p=subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',f'raw/{name}.mp3'],text=True)
              dur=float(json.loads(p)['format']['duration'])
              usable=max(0.8,target-0.14)
              ratio=dur/usable
              filters=['aresample=48000']
              if ratio > 1.003:
                  r=ratio
                  while r > 2.0:
                      filters.append('atempo=2.0'); r/=2.0
                  filters.append(f'atempo={r:.6f}')
              filters += [f'apad=pad_dur={target}',f'atrim=0:{target}','asetpts=PTS-STARTPTS']
              subprocess.run(['ffmpeg','-y','-i',f'raw/{name}.mp3','-af',','.join(filters),'-ac','1','-c:a','pcm_s16le',f'fitted/{name}.wav'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              print(name,'raw=',round(dur,3),'target=',round(target,3),'tempo=',round(max(1.0,ratio),3))
          PY

      - name: Assemble and master VO
        shell: bash
        run: |
          set -euxo pipefail
          printf "file '../fitted/01.wav'\nfile '../fitted/02.wav'\nfile '../fitted/03.wav'\nfile '../fitted/04.wav'\nfile '../fitted/05.wav'\nfile '../fitted/06.wav'\nfile '../fitted/07.wav'\nfile '../fitted/08.wav'\nfile '../fitted/09.wav'\n" > final/list.txt
          ffmpeg -y -f concat -safe 0 -i final/list.txt \
            -af "highpass=f=65,acompressor=threshold=-18dB:ratio=2:attack=10:release=120,alimiter=limit=0.95,loudnorm=I=-16:TP=-1.5:LRA=7" \
            -t 45.348503 -c:a aac -b:a 160k final/CI-FI_1939_Scene_Synced_Hindi_VO.m4a
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 final/CI-FI_1939_Scene_Synced_Hindi_VO.m4a

      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: cifi-1939-scene-synced-hindi-vo
          path: final/CI-FI_1939_Scene_Synced_Hindi_VO.m4a
          if-no-files-found: error
