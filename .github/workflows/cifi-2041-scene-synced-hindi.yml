name: CI-FI 2041 Scene Synced Hindi VO

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/cifi-2041-scene-synced-hindi.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet edge-tts

      - name: Generate scene-matched Hindi segments
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p raw fitted final
          python - <<'PY'
          import asyncio, edge_tts

          segments = [
            ('01', 9.5, 'गूगल का ये नया फीचर देखो—अब तुम कपड़े वर्चुअली ट्राय-ऑन कर सकते हो। नया ए-आई ऐसा मॉडल चुनता है जो तुम्हारी बॉडी और लुक के काफी क्लोज़ हो।'),
            ('02', 5.0, 'रेफरेंस मॉडल अलग-अलग साइज़ में हैं—छोटे साइज़ से लेकर फोर एक्स-एल तक।'),
            ('03', 5.0, 'स्किन टोन और बॉडी शेप के भी कई ऑप्शन्स मिलते हैं, ताकि मैच नैचुरल लगे।'),
            ('04', 5.3, 'पीछे डिफ्यूज़न-बेस्ड न्यूरल मॉडल कपड़े और पर्सन की फोटो को कॉम्बाइन करता है।'),
            ('05', 3.7, 'गारमेंट की फोटो और पर्सन की इमेज सिलेक्ट करो—बस।'),
            ('06', 5.0, 'फिर ए-आई कपड़े को बॉडी की सही पोज़िशन और फिट में जनरेट करता है।'),
            ('07', 5.5, 'फोल्ड्स, क्रीज़ और शैडोज़ तक बनते हैं, इसलिए फिट काफी नैचुरल दिखाई देता है।'),
            ('08', 2.424376, 'ऐसे ए-आई अपडेट्स के लिए फॉलो करो।'),
          ]

          async def main():
              for name, target, text in segments:
                  tts = edge_tts.Communicate(text, 'hi-IN-MadhurNeural', rate='+7%', pitch='-2Hz')
                  await tts.save(f'raw/{name}.mp3')

          asyncio.run(main())
          PY

      - name: Fit narration to scene timings
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import subprocess, json
          targets=[9.5,5.0,5.0,5.3,3.7,5.0,5.5,2.424376]
          for i,target in enumerate(targets,1):
              name=f'{i:02d}'
              p=subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',f'raw/{name}.mp3'],text=True)
              dur=float(json.loads(p)['format']['duration'])
              usable=max(0.8,target-0.15)
              ratio=dur/usable
              filters=['aresample=48000']
              if ratio > 1.005:
                  r=ratio
                  while r > 2.0:
                      filters.append('atempo=2.0'); r/=2.0
                  filters.append(f'atempo={r:.6f}')
              filters += [f'apad=pad_dur={target}',f'atrim=0:{target}','asetpts=PTS-STARTPTS']
              subprocess.run(['ffmpeg','-y','-i',f'raw/{name}.mp3','-af',','.join(filters),'-c:a','pcm_s16le',f'fitted/{name}.wav'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              print(name,'raw=',round(dur,3),'target=',round(target,3),'tempo=',round(max(1.0,ratio),3))
          PY

      - name: Assemble master Hindi VO
        shell: bash
        run: |
          set -euxo pipefail
          for i in 01 02 03 04 05 06 07 08; do echo "file '../fitted/${i}.wav'"; done > final/list.txt
          ffmpeg -y -f concat -safe 0 -i final/list.txt \
            -af "highpass=f=65,acompressor=threshold=-18dB:ratio=2:attack=10:release=120,alimiter=limit=0.95,loudnorm=I=-16:TP=-1.5:LRA=7" \
            -t 41.424376 -c:a aac -b:a 160k final/CI-FI_2041_Scene_Synced_Hindi_VO.m4a
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 final/CI-FI_2041_Scene_Synced_Hindi_VO.m4a

      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: cifi-2041-scene-synced-hindi-vo
          path: final/CI-FI_2041_Scene_Synced_Hindi_VO.m4a
          if-no-files-found: error
