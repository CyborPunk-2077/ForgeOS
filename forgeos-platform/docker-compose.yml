version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: forgeos
      POSTGRES_USER: forgeos_user
      POSTGRES_PASSWORD: forgeos_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeos_user -d forgeos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: